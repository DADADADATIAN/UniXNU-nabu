schema_version = 2

# Xiaomi Pad 5 (nabu), SM8150 / Adreno 640, running iPadOS 17.7 (21H16, j171ap).
# Record of truth for the porting state lives in porting.toml.

[board]
name = "nabu"
soc = "SM8150"
soc_source = "sm8150"
# The 21H16 OS profile is proposed upstream; until it lands in UniXNU/UniXNU
# profiles/os/, resolve with the profile copied into a local UniXNU checkout.
os_profile = "ipados-17.7-21H16"
description = "Xiaomi Pad 5"
kit = "nabu"

[components]
include = [
  "ArmDTPlatform", "ArmCpu", "DarwinBoot", "XnuPrelink",
  "NativeUfs", "NativeRamBlock", "VirtioMmioBlock",
  "GopFramebuffer", "AppleKeyStoreState",
  "NabuAdreno", "AdrenoMetal", "metal2vulkan",
  "NabuPlatform", "NabuTouch", "device",
]

[device_tree]
source = "device:dts/nabu.dts"
include_dirs = ["soc:dts"]

[ipsw]
url = "https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-78914/A081E8C4-D00A-4FC5-A650-A42EA1726236/iPad_10.2_17.7_21H16_Restore.ipsw"
product = "iPad7,11"
version = "17.7"
build = "21H16"
device_class = "j171ap"
chip_id = 0x8010
board_id = 0x1C
security_domain = 1
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"kernelcache.release.ipad7c" = "2c395d03d21129d79f4ad9648fe30b1dd8fc62b17f180b79976604102a4678ba"
"DeviceTree.j171ap.im4p" = "1d5ce5ee967b98df2b0017931d3a18b77add92f8902b42b12061ab5e21fd0ebb"
"044-17597-018.dmg.trustcache" = "7640ab0933ba6a9048b6de8cf7e1e0d4806350c5eb2ccb3bc1284b79b1499e2d"
"044-18090-018.dmg.trustcache" = "381d0eeb39949a4ed9cbca7f89ae3442fa37e9afcaaa5f1314465b43aaa46ea4"

# iPadOS windows live in a deliberately unallocated UFS range on LUN0 sda;
# the GPT userdata entry belongs to Android and is not repartitioned.
# OS window: LBA 2739968, 11718723 x 512B sectors; SystemOS window: LBA
# 4204809, 6451200 x 512B sectors. The combined span is LBA 2739968..5011208.
[userdata]
first_lba = 2739968
last_lba = 5011208
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "nabu_ufs_gpu_metal_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8150.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# Archive producers run in order before the kernel link. The nabu build
# currently runs these through the project CI pipeline in scripts/; migration
# to the unixnu resolver entry points is tracked in porting.toml.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-nabu-platform.py ArmDTPlatform",
  "build-nabu-platform.py ArmCpu",
  "build-libpthread-kernel.py",
  "build-nabu-owner-root.py",
  "build-nabu-virtio.py",
  "build-nabu-ufs-root.py",
  "build-nabu-ram-block.py",
  "build-nabu-legacy-display.py",
  "build-nabu-adreno.py",
  "build-nabu-gpu-userprobe.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f7d1952c7a21633d212eccf288e77444fff0cc86976db5de292f6819c2ffa1b2"
slide = "-0x1360000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005b70ae0"
roots = [
  "com.apple.filesystems.apfs",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOSurface",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriverSafeBoot",
  "com.apple.iokit.IOGPUFamily",
]
extra_args = ["--storage-bindings", "build/native-ufs/bindings.json"]

# Boot chain: stock Xiaomi UEFI -> rEFInd -> /EFI/UniXNU/UniXNU.efi menu ->
# /EFI/UniXNU/Drivers/DarwinBoot.efi loads Payloads/*.macho + .adt +
# .trustcache + initrd. No Mu-Silicium firmware image is built for this board.
[firmware]
config = "nabu"
# External firmware: stock Xiaomi UEFI plus rEFInd; dsc/fd intentionally empty.
dsc = ""
fd = ""
packages = []

[payload]
volume = "ESP"
size_mib = 334
loader = "firmware"
title = "Nabu XNU bring-up"
timeout = 20
dram_size = 0x140000000
panic_screen = false
kernel_args = [
  "-v", "serial=3", "cpus=8",
  "nabu-log=1", "nabu-gpu=1",
  "native-ufs-root=1",
  "native-ufs-os-lba=2739968", "native-ufs-os-sectors=11718723",
  "native-ufs-systemos-lba=4204809", "native-ufs-systemos-sectors=6451200",
  "armcpu-self-ipi=1", "t733-managed-rt-normal=1",
]

[payload.adt]
chip_id = "8010"
owned_memory_size = "0x40000000"
root_match_volume_uuid = "F577F6BD-3BB9-4864-BBDF-972FC2E94AE3"
cpu_regs = "0,0x100"
psci_method = "smc"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"
