hardware = ["Xiaomi Pad 5"]
os_abi = ["ipados-17.7-21H16"]
board_dependencies = ["DarwinBoot GOP handoff", "board ADT"]
verified_devices = ["nabu"]
dependencies = []
source_files = ["NabuGraphicsStatus.cpp", "NabuLegacyCpuPixels.h", "NabuLegacyCpuPresent.cpp", "NabuGpuScanoutHandoff.h", "NabuGpuScanoutWire.h", "NabuScanoutSourceCache.h", "NabuGpuUserprobeAddon.h", "NabuGpuProblemStream.h"]
runtime_identifiers = ["NGPSwap", "nabu-gpu"]
build_stage = "embedded"
build = []
outputs = []

[[component]]
