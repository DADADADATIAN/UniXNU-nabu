revision = "d4d22d9819b0162eda49f6402235dddc2279410d"
path = "drivers/NativeRamBlock"
hardware = ["SM8150"]
os_abi = ["ipados-17.7-21H16", "IOStorageFamily"]
board_dependencies = ["Data UUID 0A5EED00-0000-4000-8000-000000000001 seed"]
verified_devices = ["nabu"]
dependencies = []
source_files = ["NativeRamBlock.cpp"]
runtime_identifiers = ["NativeRamBlock"]
build_stage = "kernel"
build = ["build-nabu-ram-block.py"]
outputs = []

[[component]]
id = "NabuUserprobe"
