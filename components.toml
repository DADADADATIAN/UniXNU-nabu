schema_version = 1

# nabu device-scope components. SoC-scope components (ArmCpu, NativeUfs,
# NabuAdreno, AdrenoMetal, metal2vulkan) are declared by the sm8150 soc source.

[[component]]
id = "device"
kind = "package"
function = "nabu platform composition: board services, UFS resources, scanout handoff, boot log and diagnostics"
scope = "board"
repository = "https://github.com/zzweiqing/UniXNU-nabu"
revision = "12a070555a9ef321df367311b4812f2bfa87beac"
path = "."
hardware = ["Xiaomi Pad 5", "SM8150", "Adreno 640"]
os_abi = ["ipados-17.7-21H16"]
board_dependencies = ["Apple original kernelcache 21H16", "stock Xiaomi UEFI + rEFInd", "ESP FAT layout"]
verified_devices = ["nabu"]
dependencies = []
source_files = ["platform/NabuBootPMGR.cpp", "platform/NabuHeartbeat.cpp", "platform/NabuKeybagNotifications.cpp", "platform/NabuLegacyDisplayProbe.cpp", "platform/NabuLegacyDiscovery.cpp", "platform/NabuLegacyStubs.cpp", "platform/NabuWatchdog.cpp", "ufs/NabuLogCore.h", "ufs/NabuLogFormat.h", "ufs/NabuLogUfs.h", "ufs/NabuLogVolume.h", "ufs/NabuLogWatch.h", "ufs/NabuUfsHostSafety.h", "ufs/NabuUfsQueue.h", "ufs/NabuUfsResources.h", "ufs/NabuUfsService.h"]
runtime_identifiers = ["NABULOG2", "nabu-log", "NabuBootPMGR", "NabuHeartbeat", "NabuWatchdog"]
build_stage = "embedded"
build = []
outputs = []

[[component]]
